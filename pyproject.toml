[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentient-sim"
version = "0.4.0"
description = "A controlled adaptive-agent simulation with paired causal ablations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
authors = [{name = "Henry Barrientos"}]
license = {file = "LICENSE"}
keywords = ["agent-based model", "adaptive agents", "causal ablation", "artificial life"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]

[project.urls]
Repository = "https://github.com/henrybarrientos27/sentient_sim"
Issues = "https://github.com/henrybarrientos27/sentient_sim/issues"

[project.scripts]
sentient-sim = "sentient_sim.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
